<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tracker.css">
    <title>Tracker de gastos</title>
</head>
<body>
    <h1 class="titulo_dinero">Dinerito</h1>

    <a href="index.html" class="boton-inicio" title="Volver al inicio" onclick="
        alert('Volviendo a la pagina de inicio')
        ">🏠</a>
    <section class="seccion-formulario">
            <h2>Añadir Nuevo Gasto</h2>
            <form id="formulario">
                <!-- action="results.html" method="GET o POST" ... type="checkbox" "radio"-->
                <div>
                    <label for = "contexto">Seccion:</label>
                    <select name ="contexto" id="contexto" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="Comida">Comida</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Ocio">Ocio</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <div>
                    <label for="cantidad">Cantidad:</label>
                    <input id="cantidad" name="cantidad" type="number" step="0.01" min=0 required>

                </div>
                <div>
                    <label for="fecha">Fecha:</label>
                    <input id="fecha" name="fecha" type="date" required>
                </div>
                <div>
                    <label for="comentario">Comentario:</label>
                    <textarea id="comentario" name="comentario"></textarea>
                </div>
                <button type="reset">Reiniciar</button>
                <button type="submit">Guardar</button>
            </form>
        </section>
        <!-- Sección de la Tabla -->
<section class="seccion-tabla">
    <h2>Lista de Gastos</h2>
    <table border="1" id="tabla-gastos">
        <thead>
            <tr>
                <th>Sección</th>
                <th>Cantidad</th>
                <th>Fecha</th>
                <th>Comentario</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
            <!-- Aquí JavaScript irá agregando cada fila -->
        </tbody>
    </table>
</section>
<script>
    const formulario = document.getElementById('formulario');
    const cuerpoTabla = document.getElementById('cuerpo-tabla');

    // 1. Cargar gastos de localStorage al iniciar (o crear una lista vacía si no hay nada guardado)
    let misGastos = JSON.parse(localStorage.getItem('misGastos')) || [];

    // Dibujar la tabla nada más cargar/recargar la página
    renderizarTabla();

    // 2. Escuchar cuando el usuario añade un gasto
    formulario.addEventListener('submit', function(e) {
        e.preventDefault();

        // Capturar valores
        const seccion = document.getElementById('contexto').value;
        const cantidad = parseFloat(document.getElementById('cantidad').value);
        const fecha = document.getElementById('fecha').value;
        const comentario = document.getElementById('comentario').value || '-';

        // Guardar nuevo gasto
        misGastos.push({ seccion, cantidad, fecha, comentario });

        // Ordenar por fecha (de más reciente a más antigua)
        misGastos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

        // GUARDAR EN LOCALSTORAGE (Convertimos la lista a texto con JSON.stringify)
        localStorage.setItem('misGastos', JSON.stringify(misGastos));

        // Actualizar la tabla en pantalla
        renderizarTabla();

        // Limpiar el formulario
        formulario.reset();
    });

    // 3. Función para renderizar la tabla
    function renderizarTabla() {
        cuerpoTabla.innerHTML = ''; // Vaciar tabla actual

        misGastos.forEach((gasto, index) => {
            const nuevaFila = document.createElement('tr');
            nuevaFila.innerHTML = `
                <td>${gasto.seccion}</td>
                <td>${gasto.cantidad.toFixed(2)} €</td>
                <td>${gasto.fecha}</td>
                <td>${gasto.comentario}</td>
                <td><button onclick="borrarGasto(${index})" style="cursor:pointer;">❌</button></td>
            `;
            cuerpoTabla.appendChild(nuevaFila);
        });
    }

    // 4. Función opcional para borrar un gasto individual
    function borrarGasto(index) {
        misGastos.splice(index, 1); // Quitar el elemento de la lista
        localStorage.setItem('misGastos', JSON.stringify(misGastos)); // Actualizar almacenamiento
        renderizarTabla(); // Volver a pintar la tabla
    }
</script>
</body>
</html>
